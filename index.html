<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - RED/OVA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="split-layout">

    <section class="branding-section" aria-label="Branding RED/OVA">

        <div class="branding-overlay">

            <div class="brand-logo">
                RED/OVA
            </div>

            <div class="branding-text">

                <p class="small-text">
                    CREATIVE DIGITAL SPACE
                </p>

                <h1>
                    Temukan dunia
                    <span>kreativitas</span>
                    tanpa batas.
                </h1>

                <p class="artist">
                    Explore ideas. Create something different.
                </p>

            </div>

            <div class="image-wrapper">
                <img
                    src="images/login.jpg"
                    alt="Creative artwork"
                >
            </div>

        </div>

    </section>


    <section class="form-section">

        <div class="form-wrapper">

            <div class="mobile-logo">
                RED/OVA
            </div>

            <h2 class="form-title">
                Sign in to your account
            </h2>

            <p class="form-subtitle">
                Welcome back! Please enter your details.
            </p>


            <button
                class="btn-sso"
                type="button"
                aria-label="Sign in with Google"
            >

                <span class="google-icon">G</span>

                <span>
                    Sign in with Google
                </span>

            </button>


            <div class="divider">
                <span>or sign in with email</span>
            </div>


            <form
                action="#"
                method="POST"
                class="login-form"
            >

                <div class="input-group">

                    <label for="username">
                        Email or Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your email or username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="input-group">

                    <div class="password-header">

                        <label for="password">
                            Password
                        </label>

                        <a
                            href="#"
                            class="forgot-link"
                        >
                            Forgot Password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div class="checkbox-group">

                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >

                    <label for="remember">
                        Remember me
                    </label>

                </div>


                <button
                    type="submit"
                    class="btn-primary"
                >
                    Sign In
                </button>

            </form>


            <p class="signup-prompt">
                Don't have an account?
                <a href="#">
                    Sign up
                </a>
            </p>

        </div>

    </section>

</main>

</body>
</html>
